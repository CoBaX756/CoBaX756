<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 232" width="960" height="232" role="img" aria-label="Lo que construyo: aplicaciones web para varias empresas a la vez, con Laravel y Filament; servicios y APIs con .NET; y la puesta en producción con Docker en servidor propio.">
