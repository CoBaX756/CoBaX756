<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Xabier, desarrollo de software a medida desde Bilbao</title>
  <desc id="d">Ilustración del Puente Colgante de Bizkaia: una góndola cruza la ría de un lado a otro colgada de la viga superior.</desc>
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1720"/>
      <stop offset="1" stop-color="#17303f"/>
    </linearGradient>
  </defs>
  <style>
    .nombre { font: 700 64px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #e8f0f4; letter-spacing: -1px; }
    .linea  { font: 400 24px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #e8f0f4; }
    .lugar  { font: 400 17px 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #93b3c7; }
    .gondola { animation: cruzar 16s infinite; }
    .luz { animation: parpadeo 4s ease-in-out infinite; }
    .onda { animation: mecer 9s ease-in-out infinite alternate; }
    .o1 { animation-duration: 11s; animation-direction: alternate-reverse; }
    .est { animation: brillo 5s ease-in-out infinite; }
    .e1 { animation-delay: 1.4s; } .e2 { animation-delay: 3s; }
    @keyframes cruzar {
      0%, 7%   { transform: translateX(635px); animation-timing-function: cubic-bezier(.45, 0, .55, 1); }
      46%, 54% { transform: translateX(945px); animation-timing-function: cubic-bezier(.45, 0, .55, 1); }
      93%, 100% { transform: translateX(635px); }
    }
    @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: .65; } }
    @keyframes mecer { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    @keyframes brillo { 0%, 100% { opacity: .9; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) {
      .gondola, .luz, .onda, .est { animation: none; }
      .gondola { transform: translateX(835px); }
    }
  </style>

